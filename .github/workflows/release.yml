name: Release Updater

on:
  push:
    tags:
      - "updater-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: true
      - name: Resolve version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#updater-v}"
          [[ "$GITHUB_REF_NAME" == "updater-v${version}" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Build release artifacts
        run: bash scripts/build-release.sh "${{ steps.release.outputs.version }}"

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "release-artifacts/*"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --verify-tag --latest=false --generate-notes \
            --title "Updater ${{ steps.release.outputs.version }}"
